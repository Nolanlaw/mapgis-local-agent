[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mapgis-local-agent"
version = "0.7.0"
description = "MapGIS 6.7 native files, isolated native backend and exact-build live state"
requires-python = ">=3.12"
dependencies = [
    "mapgis2shp==2.6.0", "mcp>=1.20,<2", "psutil>=6",
    "pyvips==3.0.0", "pyvips-binary==8.18.7",
    "opencv-python-headless==4.13.0.92", "rasterio==1.4.4",
    "scipy==1.16.2", "contourpy==1.3.3", "networkx==3.5", "pyogrio==0.13.0",
    "openpyxl==3.1.5",
    "ezdxf==1.4.5",
    "pyflwdir==0.5.12", "numba==0.68.1", "llvmlite==0.50.0",
    "pywin32==312; sys_platform == 'win32'",
]

[project.scripts]
mapgis-agent = "mapgis_agent.cli:main"
mapgis-agent-mcp = "mapgis_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mapgis_agent"]

[tool.hatch.build.targets.wheel.force-include]
"workflows" = "mapgis_agent/workflows"

[tool.pytest.ini_options]
testpaths = ["tests"]

